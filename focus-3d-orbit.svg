<svg width="1120" height="220" viewBox="0 0 1120 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Learning Journey and Current Focus Roadmap">
  <defs>
    <linearGradient id="roadmapBg" x1="0" y1="0" x2="1120" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070A12"/>
      <stop offset="50%" stop-color="#0B101D"/>
      <stop offset="100%" stop-color="#070A12"/>
    </linearGradient>
    <linearGradient id="trackGrad" x1="120" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="35%" stop-color="#3B82F6"/>
      <stop offset="70%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="nodeCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.015"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="1118" height="218" rx="16" fill="url(#roadmapBg)" stroke="#1E293B" stroke-width="1.2"/>

  <!-- Connecting 3D Perspective Track -->
  <path d="M 140 82 L 980 82" stroke="url(#trackGrad)" stroke-opacity="0.38" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="140" cy="82" r="4" fill="#22D3EE">
    <animate attributeName="cx" values="140;980" dur="5.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Node 1: Foundations -->
  <g transform="translate(40, 32)">
    <rect x="0" y="0" width="236" height="156" rx="12" fill="url(#nodeCard)" stroke="#334155" stroke-width="1"/>
    <polygon points="118,32 136,44 118,56 100,44" fill="#8B5CF6" fill-opacity="0.28" stroke="#A78BFA" stroke-width="1.3"/>
    <text x="118" y="84" text-anchor="middle" fill="#A78BFA" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10.5" font-weight="600" letter-spacing="1.2">
      PHASE 01 · CORE
    </text>
    <text x="118" y="108" text-anchor="middle" fill="#F8FAFC" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700">
      C, Java &amp; CS Foundations
    </text>
    <text x="118" y="130" text-anchor="middle" fill="#94A3B8" font-family="'Segoe UI', system-ui, sans-serif" font-size="12">
      Memory, OOP &amp; problem solving
    </text>
  </g>

  <!-- Node 2: Frontend Mastery -->
  <g transform="translate(308, 32)">
    <rect x="0" y="0" width="236" height="156" rx="12" fill="url(#nodeCard)" stroke="#334155" stroke-width="1"/>
    <polygon points="118,32 136,44 118,56 100,44" fill="#3B82F6" fill-opacity="0.3" stroke="#60A5FA" stroke-width="1.3"/>
    <text x="118" y="84" text-anchor="middle" fill="#60A5FA" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10.5" font-weight="600" letter-spacing="1.2">
      PHASE 02 · ACTIVE
    </text>
    <text x="118" y="108" text-anchor="middle" fill="#F8FAFC" font-family="'Segoe UI', system-ui, sans-serif" font-size="14.5" font-weight="700">
      Modern Web Interfaces
    </text>
    <text x="118" y="130" text-anchor="middle" fill="#94A3B8" font-family="'Segoe UI', system-ui, sans-serif" font-size="12">
      HTML5, CSS3, JS &amp; Tailwind CSS
    </text>
  </g>

  <!-- Node 3: Full-Stack Exploration -->
  <g transform="translate(576, 32)">
    <rect x="0" y="0" width="236" height="156" rx="12" fill="url(#nodeCard)" stroke="#22D3EE" stroke-opacity="0.45" stroke-width="1.2"/>
    <polygon points="118,32 136,44 118,56 100,44" fill="#22D3EE" fill-opacity="0.32" stroke="#22D3EE" stroke-width="1.4"/>
    <text x="118" y="84" text-anchor="middle" fill="#22D3EE" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10.5" font-weight="600" letter-spacing="1.2">
      PHASE 03 · EXPLORING
    </text>
    <text x="118" y="108" text-anchor="middle" fill="#F8FAFC" font-family="'Segoe UI', system-ui, sans-serif" font-size="14.5" font-weight="700">
      Full-Stack Architecture
    </text>
    <text x="118" y="130" text-anchor="middle" fill="#94A3B8" font-family="'Segoe UI', system-ui, sans-serif" font-size="12">
      React, Node.js, Express, MongoDB
    </text>
  </g>

  <!-- Node 4: AI / ML Frontier -->
  <g transform="translate(844, 32)">
    <rect x="0" y="0" width="236" height="156" rx="12" fill="url(#nodeCard)" stroke="#334155" stroke-width="1"/>
    <polygon points="118,32 136,44 118,56 100,44" fill="#8B5CF6" fill-opacity="0.32" stroke="#C084FC" stroke-width="1.3"/>
    <text x="118" y="84" text-anchor="middle" fill="#C084FC" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10.5" font-weight="600" letter-spacing="1.2">
      PHASE 04 · FRONTIER
    </text>
    <text x="118" y="108" text-anchor="middle" fill="#F8FAFC" font-family="'Segoe UI', system-ui, sans-serif" font-size="14.5" font-weight="700">
      AI &amp; Machine Learning
    </text>
    <text x="118" y="130" text-anchor="middle" fill="#94A3B8" font-family="'Segoe UI', system-ui, sans-serif" font-size="12">
      Intelligent systems &amp; real projects
    </text>
  </g>
</svg>
