<svg width="1200" height="36" viewBox="0 0 1200 36" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Futuristic neon section divider">
  <defs>
    <linearGradient id="divLine" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080B12" stop-opacity="0"/>
      <stop offset="20%" stop-color="#3B82F6" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#8B5CF6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#080B12" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulseBeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <line x1="40" y1="18" x2="1160" y2="18" stroke="url(#divLine)" stroke-width="1.5"/>

  <rect x="-180" y="17" width="180" height="2" fill="url(#pulseBeam)">
    <animate attributeName="x" values="-180;1220" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Central 3D Diamond Prism -->
  <g transform="translate(600, 18)">
    <polygon points="0,-10 14,0 0,10 -14,0" fill="#080B12" stroke="#22D3EE" stroke-width="1.4"/>
    <polygon points="0,-5 7,0 0,5 -7,0" fill="#22D3EE" fill-opacity="0.75">
      <animate attributeName="fill-opacity" values="0.45;0.95;0.45" dur="2.6s" repeatCount="indefinite"/>
    </polygon>
  </g>
</svg>
