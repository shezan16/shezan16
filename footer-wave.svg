<svg width="1200" height="140" viewBox="0 0 1200 140" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ridwan Ahamed Shezan Footer — Turning Ideas Into Digital Experiences Through Code">
  <defs>
    <linearGradient id="footBg" x1="0" y1="0" x2="1200" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#060911"/>
      <stop offset="50%" stop-color="#080B12"/>
      <stop offset="100%" stop-color="#0B101D"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.16"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.18"/>
    </linearGradient>
    <clipPath id="footClip">
      <rect x="1" y="1" width="1198" height="138" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#footClip)">
    <rect width="1200" height="140" fill="url(#footBg)"/>

    <!-- Animated Wave Layer 1 -->
    <path fill="url(#wave1)">
      <animate attributeName="d" dur="8s" repeatCount="indefinite"
        values="M0,88 C240,48 420,122 660,82 C900,42 1040,108 1200,76 L1200,140 L0,140 Z;
                M0,74 C260,112 460,52 700,90 C920,122 1060,58 1200,86 L1200,140 L0,140 Z;
                M0,88 C240,48 420,122 660,82 C900,42 1040,108 1200,76 L1200,140 L0,140 Z"/>
    </path>

    <!-- Animated Wave Layer 2 -->
    <path fill="url(#wave2)">
      <animate attributeName="d" dur="10s" repeatCount="indefinite"
        values="M0,104 C280,130 480,68 740,104 C960,134 1080,82 1200,100 L1200,140 L0,140 Z;
                M0,92 C250,62 490,126 720,88 C940,56 1090,118 1200,94 L1200,140 L0,140 Z;
                M0,104 C280,130 480,68 740,104 C960,134 1080,82 1200,100 L1200,140 L0,140 Z"/>
    </path>

    <!-- Tagline -->
    <text x="600" y="54" text-anchor="middle" fill="#F8FAFC" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="0.4">
      "Turning Ideas Into Digital Experiences Through Code."
    </text>
    <text x="600" y="80" text-anchor="middle" fill="#94A3B8" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11.5" letter-spacing="1.2">
      RIDWAN AHAMED SHEZAN · @shezan16 · DAFFODIL INTERNATIONAL UNIVERSITY
    </text>
  </g>

  <rect x="1" y="1" width="1198" height="138" rx="16" fill="none" stroke="#1E293B" stroke-width="1.2"/>
</svg>
