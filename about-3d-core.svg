<svg width="420" height="320" viewBox="0 0 420 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="3D Isometric Full-Stack and AI Architecture Diagram">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="420" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070A12"/>
      <stop offset="100%" stop-color="#0D1322"/>
    </linearGradient>
    <radialGradient id="centerAura" cx="0.5" cy="0.52" r="0.48">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#3B82F6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#070A12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="layerCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="layerBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="layerPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6D28D9" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="glowNode" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="418" height="318" rx="16" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2"/>
  <rect x="1" y="1" width="418" height="318" rx="16" fill="url(#centerAura)"/>

  <!-- Subtle Header -->
  <text x="24" y="34" fill="#94A3B8" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" font-weight="600" letter-spacing="1.4">
    ENGINEERING STACK ARCHITECTURE
  </text>

  <!-- Central Vertical Data Axis -->
  <line x1="210" y1="74" x2="210" y2="262" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1.2" stroke-dasharray="4 4"/>
  <circle cx="210" cy="110" r="3.5" fill="#22D3EE" filter="url(#glowNode)">
    <animate attributeName="cy" values="250;90;250" dur="4.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Layer 3 (Bottom): CS & C Core -->
  <g transform="translate(210, 226)">
    <animateTransform attributeName="transform" type="translate" values="210,226; 210,231; 210,226" dur="5.5s" repeatCount="indefinite"/>
    <polygon points="0,-36 92,0 0,36 -92,0" fill="url(#layerPurple)" stroke="#8B5CF6" stroke-width="1.3"/>
    <polygon points="-92,0 0,36 0,46 -92,10" fill="#4C1D95" fill-opacity="0.45" stroke="#8B5CF6" stroke-opacity="0.5" stroke-width="1"/>
    <polygon points="92,0 0,36 0,46 92,10" fill="#2E1065" fill-opacity="0.6" stroke="#8B5CF6" stroke-opacity="0.5" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#E9D5FF" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.8">
      CS CORE · C · JAVA · OOP
    </text>
  </g>

  <!-- Layer 2 (Middle): Full-Stack & UI -->
  <g transform="translate(210, 166)">
    <animateTransform attributeName="transform" type="translate" values="210,166; 210,162; 210,166" dur="4.8s" repeatCount="indefinite"/>
    <polygon points="0,-36 92,0 0,36 -92,0" fill="url(#layerBlue)" stroke="#3B82F6" stroke-width="1.3"/>
    <polygon points="-92,0 0,36 0,46 -92,10" fill="#1E3A8A" fill-opacity="0.45" stroke="#3B82F6" stroke-opacity="0.5" stroke-width="1"/>
    <polygon points="92,0 0,36 0,46 92,10" fill="#172554" fill-opacity="0.6" stroke="#3B82F6" stroke-opacity="0.5" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#DBEAFE" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.8">
      HTML5 · CSS3 · JS · TAILWIND
    </text>
  </g>

  <!-- Layer 1 (Top): Exploring Frontier -->
  <g transform="translate(210, 106)">
    <animateTransform attributeName="transform" type="translate" values="210,106; 210,98; 210,106" dur="4.2s" repeatCount="indefinite"/>
    <polygon points="0,-36 92,0 0,36 -92,0" fill="url(#layerCyan)" stroke="#22D3EE" stroke-width="1.5"/>
    <polygon points="-92,0 0,36 0,46 -92,10" fill="#0E7490" fill-opacity="0.45" stroke="#22D3EE" stroke-opacity="0.6" stroke-width="1"/>
    <polygon points="92,0 0,36 0,46 92,10" fill="#083344" fill-opacity="0.65" stroke="#22D3EE" stroke-opacity="0.6" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#ECFEFF" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.8">
      MERN &amp; AI / ML FRONTIER
    </text>
  </g>

  <!-- Bottom Caption -->
  <text x="210" y="298" text-anchor="middle" fill="#64748B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10.5">
    Daffodil International University · B.Sc. in CSE
  </text>
</svg>
